name: Deploy Daily Scoreboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/daily-scoreboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (app only, without the worker source)
        run: |
          mkdir -p _site
          cp -r apps/daily-scoreboard/. _site/
          rm -rf _site/worker

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
